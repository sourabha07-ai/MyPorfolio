<article class="contact" data-page="contact">

        <header>
          <h2 class="h2 article-title">Contact</h2>
        </header>
<section class="contact-form">

          <h3 class="h3 form-title">Contact Form</h3>

          <form class="form" data-form data-recipient="sourabhajena2003@gmail.com">

            <div class="input-wrapper">
              <label class="visually-hidden" for="contact-name">Full name</label>
              <input id="contact-name" type="text" name="fullname" class="form-input" placeholder="Full name" autocomplete="name" required data-form-input>

              <label class="visually-hidden" for="contact-email">Email address</label>
              <input id="contact-email" type="email" name="email" class="form-input" placeholder="Email address" autocomplete="email" required data-form-input>
            </div>

            <label class="visually-hidden" for="contact-message">Your message</label>
            <textarea id="contact-message" name="message" class="form-input" placeholder="Your Message" required data-form-input></textarea>
            <p class="form-status" data-form-status role="status" aria-live="polite"></p>

            <button class="form-btn" type="submit" disabled data-form-btn>
              <ion-icon name="paper-plane"></ion-icon>
              <span>Send Message</span>
            </button>

          </form>

        </section>

      </article>
